# OmegaConf configuration file for airplane detection project

# Model configuration
model:
  # Model name to use (yolov8n, yolov8s, yolov8m, yolov8l, yolov8x, yolov9e)
  name: "yolov8x"
  
  # Path to local model file (overrides model.name if provided)
  local_path: null
  
  # Force re-download of model even if it exists
  force_download: false
  
  # Directory to store downloaded models
  models_dir: null  # null uses default: ~/.airplane_detection/models

# Detection parameters
detection:
  # Confidence threshold for detections (0.0 to 1.0)
  confidence_threshold: 0.25
  
  # IoU threshold for Non-Maximum Suppression (0.0 to 1.0)
  iou_threshold: 0.45
  
  # Input image size (640, 960, or 1280)
  image_size: 960

# Paths configuration
paths:
  # Default input directory
  input_dir: "data/input"
  
  # Default output directory (null uses input directory parent + "detection_results")
  output_dir: null
  
  # Supported image file extensions
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tif"
    - ".tiff"
    - ".bmp"

# Model URLs (for reference, used by ModelLoader)
# Repository: https://huggingface.co/iturslab/Efficient-YOLO-RS-Airplane-Detection
# Models are in subdirectories: training/ and transfer-learning/
# Each contains experiment subdirectories with best.pt files
model_urls:
  # Training model (experiment-57)
  best_training: "https://huggingface.co/iturslab/Efficient-YOLO-RS-Airplane-Detection/resolve/main/training/experiment-57/best.pt"
  # Transfer learning model (experiment-62)
  best_transfer_learning: "https://huggingface.co/iturslab/Efficient-YOLO-RS-Airplane-Detection/resolve/main/transfer-learning/experiment-62/best.pt"
  # Hugging Face model ID for direct loading (recommended)
  huggingface_model_id: "iturslab/Efficient-YOLO-RS-Airplane-Detection"

# Output settings
output:
  # Save detection results
  save: true
  
  # Show results (display images)
  show: false
  
  # Save visualization images
  save_visualization: true

