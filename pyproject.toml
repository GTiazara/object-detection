[tool.poetry]
name = "yolo-detection"
version = "0.1.0"
description = "YOLO training and prediction for object detection"
authors = ["gaetan.tiazara <gaetan.tiazara@ign.fr>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12.4"
ultralytics = ">=8.0.0"
huggingface_hub = ">=0.20.0"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
opencv-python = ">=4.8.0"
pillow = ">=12.0.0"
numpy = ">=1.24.0"
requests = ">=2.32.0"
matplotlib = ">=3.7.0"
tqdm = ">=4.66.0"
omegaconf = ">=2.3.0"
pyyaml = ">=6.0.3,<7.0.0"
albumentationsx = "^2.0.13"
clearml = "^2.0.2"
python-dotenv = ">=1.0.0"
rasterio = "^1.4.3"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"