[project]
name = "airplane-detection"
version = "0.1.0"
description = "Airplane detection in satellite imagery using YOLOv8/YOLOv9 models"
authors = [
    {name = "gaetan.tiazara",email = "gaetan.tiazara@ign.fr"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.0.0",
    "yolov5>=7.0.0",
    "huggingface_hub>=0.20.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "pillow>=12.0.0",
    "numpy>=1.24.0",
    "requests>=2.32.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "omegaconf>=2.3.0",
    "openmim>=0.3.9,<0.4.0",
]

[tool.poetry]
packages = [{include = "airplane_detection", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
